name: pedidos360-stack
services:
  rabbit1:
    image: rabbitmq:4.2.9-management
    hostname: rabbit1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE
        en .env}
      RABBITMQ_DEFAULT_USER: pedidos360
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    ports:
    - 127.0.0.1:45674:5672
    - 127.0.0.1:15674:15672
    volumes:
    - rabbit1_data:/var/lib/rabbitmq
    - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped
  rabbit2:
    image: rabbitmq:4.2.9-management
    hostname: rabbit2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE
        en .env}
      RABBITMQ_DEFAULT_USER: pedidos360
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    ports:
    - 127.0.0.1:45675:5672
    - 127.0.0.1:15675:15672
    volumes:
    - rabbit2_data:/var/lib/rabbitmq
    - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    depends_on:
      rabbit1:
        condition: service_healthy
  rabbit-setup:
    image: curlimages/curl:8.12.1
    entrypoint:
    - /bin/sh
    - /scripts/configure.sh
    environment:
      RABBITMQ_DEFAULT_USER: pedidos360
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    volumes:
    - ./infra/rabbitmq/configure.sh:/scripts/configure.sh:ro
    - ./infra/rabbitmq/definitions.json:/config/definitions.json:ro
    depends_on:
      rabbit1:
        condition: service_healthy
      rabbit2:
        condition: service_healthy
    restart: 'no'
  catalog-db:
    image: postgres:17
    profiles:
    - apps
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Define CATALOG_DB_PASSWORD en .env}
    volumes:
    - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U catalog_user -d catalog_db
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  orders-db:
    image: postgres:17
    profiles:
    - apps
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?Define ORDERS_DB_PASSWORD en .env}
    volumes:
    - orders_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U orders_user -d orders_db
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: catalog-service
    profiles:
    - apps
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: '8081'
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/catalog_db
      SPRING_DATASOURCE_USERNAME: catalog_user
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
    - 127.0.0.1:8091:8081
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: unless-stopped
  orders-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: orders-service
    profiles:
    - apps
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: '8082'
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/orders_db
      SPRING_DATASOURCE_USERNAME: orders_user
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      SPRING_RABBITMQ_USERNAME: pedidos360
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CATALOG_BASE_URL: http://catalog-service:8081
    ports:
    - 127.0.0.1:8092:8082
    depends_on:
      orders-db:
        condition: service_healthy
      rabbit-setup:
        condition: service_completed_successfully
      catalog-service:
        condition: service_started
      notify-service:
        condition: service_started
    restart: unless-stopped
  notify-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notify-service
    profiles:
    - apps
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: '8083'
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      SPRING_RABBITMQ_USERNAME: pedidos360
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      TASK_OUTPUT_DIRECTORY: /app/data/tareas
    ports:
    - 127.0.0.1:8093:8083
    depends_on:
      rabbit-setup:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
    - task_data:/app/data/tareas
  rabbit-admin-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: rabbit-admin-service
    profiles:
    - apps
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: '8084'
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
      SPRING_RABBITMQ_ADDRESSES: rabbit1:5672,rabbit2:5672
      SPRING_RABBITMQ_USERNAME: pedidos360
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
    - 127.0.0.1:8094:8084
    depends_on:
      rabbit-setup:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  rabbit1_data: {}
  rabbit2_data: {}
  catalog_data: {}
  orders_data: {}
  task_data: {}
