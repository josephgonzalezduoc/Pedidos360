spring.application.name=orders-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/orders_db
spring.datasource.username=orders_user
spring.datasource.password=${ORDERS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

catalog.base-url=http://localhost:8081

management.endpoints.web.exposure.include=health,info
spring.rabbitmq.host=localhost
spring.rabbitmq.port=45672
spring.rabbitmq.username=pedidos360
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

messaging.exchange.direct=cmd.direct
messaging.exchange.topic=cmd.topic
